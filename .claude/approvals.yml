version: 1
mode: enforce
rules:
  - purpose: "A change takes two people. When Claude's review passes, one is enough and Claude approves. Pull requests Renovate opened: Claude alone, if its review passes."
    paths: ["**"]
    verdict: { claude: comments, seats: 2 }
    override:
      - { if: "claude/code_review = pass AND pr/opened_by = bot:renovate", verdict: { claude: approves, seats: 0 } }
      - { if: "claude/code_review = pass", verdict: { claude: approves, seats: 1 } }
  - purpose: "Changes to the review rules, agent instructions, code owners, the Renovate config or the CodeBuild pipeline take two people."
    paths:
      # Review policy and agent config
      - "**/.claude/**"
      - "**/REVIEW.md"
      - ".agents/**"
      - ".cursor/**"
      # Agent instructions Claude reads before reviewing
      - "**/AGENTS.md"
      - "**/CLAUDE.md"
      - "**/CLAUDE.local.md"
      - "docs/agents/**"
      # Which files agents read and which tools they run
      - "**/.claudeignore"
      - "**/.cursorignore"
      - "**/.mcp.json"
      # Who reviews and what Renovate merges by itself
      - ".github/CODEOWNERS"
      - ".github/renovate.json*"
      - "renovate.json*"
      - ".renovaterc*"
      # CodeBuild pipeline
      - "**/buildspec.yml"
      - "**/build.sh"
    nested: inherit
    verdict: { claude: comments, seats: 2 }
  - purpose: "CI workflows take two people. Pull requests Renovate opened: Claude alone, if its review passes."
    paths: [".github/workflows/**"]
    nested: inherit
    verdict: { claude: comments, seats: 2 }
    override:
      - { if: "claude/code_review = pass AND pr/opened_by = bot:renovate", verdict: { claude: approves, seats: 0 } }
  - purpose: "Git attribute files keep the two-person default, with no Renovate shortcut."
    paths: ["**/.gitattributes", "**/.gitmodules"]
    verdict: { claude: comments, seats: 2 }
    override:
      - { if: "claude/code_review = pass", verdict: { claude: approves, seats: 1 } }
  - purpose: "Event payloads, dedup, click attribution, the user id cookie, delivery and the visibility gate decide what advertisers are billed: someone else from Integrations approves, whatever the review says."
    paths:
      - "src/detector.ts"
      - "src/queue.ts"
      - "src/visibility.ts"
      - "src/store.ts"
    verdict: { claude: comments, seats: [{ count: 1, from: [Topsort/integrations, "!pr/authors"] }] }
