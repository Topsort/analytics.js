name: PR checker

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
  push:
    branches:
      - main

# This is to avoid running multiple actions when a PR is updated repeatedly. See
# https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        name: Install PNPM
        id: pnpm-install

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: package.json

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint:ci

      - name: Types
        run: pnpm run types:check

  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        name: Install PNPM
        id: pnpm-install

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: package.json

      - name: Install dependencies
        run: pnpm install

      - name: Tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

  format:
    name: Biome Lint
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Biome
        uses: biomejs/setup-biome@v2

      - name: Run Biome
        run: biome ci --reporter=github

  size:
    name: Bundle Size
    runs-on: ubuntu-22.04
    outputs:
      size-exceeded: ${{ steps.size-check.outputs.exceeded }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        name: Install PNPM

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: package.json

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Check bundle size
        id: size-check
        run: |
          if pnpm size; then
            echo "exceeded=false" >> "$GITHUB_OUTPUT"
          else
            echo "exceeded=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  size-report:
    name: Bundle Size Report
    needs: size
    runs-on: ubuntu-22.04
    if: >-
      github.event_name == 'pull_request' &&
      always() &&
      needs.size.outputs.size-exceeded == 'true'
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        name: Install PNPM

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: package.json

      - uses: andresz1/size-limit-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          script: pnpm size
