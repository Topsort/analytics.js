name: Release

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  npm-publish:
    name: Publish to NPM
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        name: Install PNPM
        id: pnpm-install

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: package.json
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install

      - name: Run ESLint
        run: pnpm run lint:ci

      - name: Run tests
        run: pnpm run test

      - name: Run tsc
        run: node_modules/.bin/tsc

      - name: Build dist
        run: pnpm run build

      - name: Update npm
        # Pinned: npm 12 removed the `git-checks` config the next step relies
        # on (`--no-git-checks`), so floating on `@latest` broke publishing.
        run: npm install -g npm@10
  
      - name: Publish to npm
        id: publish
        run: npm publish --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
