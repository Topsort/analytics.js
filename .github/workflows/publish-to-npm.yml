name: Release

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  npm-publish:
    name: Publish to NPM
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        name: Install PNPM
        id: pnpm-install

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: package.json

      - name: Install dependencies
        run: pnpm install

      - name: Run ESLint
        run: pnpm run lint:ci

      - name: Run tests
        run: pnpm run test

      - name: Run tsc
        run: node_modules/.bin/tsc

      - name: Build dist
        run: pnpm run build

      # Uses the npm bundled with Node. Trusted publishing (OIDC) needs
      # npm 11.5.1 or later; Node 24 ships npm 11.
      - name: Publish to npm
        id: publish
        run: npm publish --provenance
